name: CI - Hospital Pacientes y Citas
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  DEMO_CI_FAILURE: 'true'
jobs:
  compilar-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas de todos los modulos
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -Ddemo.ci.failure="$DEMO_CI_FAILURE" clean verify
      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Guardar ejecutables
        uses: actions/upload-artifact@v7
        with:
          name: ejecutables-java21
          path: |
            eureka-server/target/eureka-server-1.0.0.jar
            api-gateway/target/api-gateway-1.0.0.jar
            pacientes-service/target/pacientes-service-1.0.0.jar
            citas-service/target/citas-service-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
