server.port=8082
spring.application.name=citas-service
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_citas}
spring.r2dbc.username=${DB_USER:hospital_citas}
spring.r2dbc.password=${CITAS_DB_PASSWORD}
spring.r2dbc.pool.initial-size=1
spring.r2dbc.pool.max-size=10
spring.sql.init.mode=always
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:hospital}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
hospital.pacientes.timeout=3s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

